<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智汇面——AI智能平台</title>
    <!-- Vue2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <!-- Markdown解析库 marked CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #f7f8fa;
        }
        /* 全局容器 - 上下整体布局 */
        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 顶部导航栏 */
        .chat-header {
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
            flex-shrink: 0;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4080ff, #73a6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
        }
        .system-name {
            font-size: 18px;
            font-weight: 600;
            color: #1d2129;
        }
        /* 主体区域：左侧历史 + 中间聊天 */
        .chat-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        /* 左侧聊天历史侧边栏 */
        .history-sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 14px;
            color: #86909c;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #4e5969;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }
        .history-item:hover {
            background: #f2f3f5;
        }
        /* 中间聊天消息区域 */
        .chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .message-wrap {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
        }
        /* 单条消息容器 */
        .message-item {
            display: flex;
            margin-bottom: 24px;
            gap: 12px;
        }
        /* 用户消息 靠右 */
        .message-user {
            flex-direction: row-reverse;
        }
        /* AI消息 靠左 */
        .message-ai {
            flex-direction: row;
        }
        /* 头像通用 */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #fff;
        }
        .avatar-user {
            background: #6b7785;
        }
        .avatar-ai {
            background: linear-gradient(135deg, #4080ff, #73a6ff);
        }
        /* 气泡容器 */
        .bubble-box {
            max-width: 65%;
        }
        /* 消息时间 */
        .msg-time {
            font-size: 12px;
            color: #c9cdd4;
            margin-bottom: 4px;
        }
        .message-user .msg-time {
            text-align: right;
        }
        /* 聊天气泡样式 */
        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
        }
        .bubble-user {
            background: #4080ff;
            color: #ffffff;
            border-top-right-radius: 4px;
        }
        .bubble-ai {
            background: #ffffff;
            color: #1d2129;
            border: 1px solid #e5e7eb;
            border-top-left-radius: 4px;
        }
        /* Markdown 内容样式 */
        .markdown-body h1, h2, h3, h4 {
            margin: 10px 0;
        }
        .markdown-body p {
            margin: 8px 0;
        }
        .markdown-body pre {
            background: #f2f3f5;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .markdown-body code {
            background: #f2f3f5;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .markdown-body ul, ol {
            padding-left: 22px;
            margin: 8px 0;
        }
        /* 图片样式 */
        .chat-img {
            max-width: 100%;
            border-radius: 8px;
            cursor: zoom-in;
            margin: 6px 0;
        }
        /* 视频样式 */
        .chat-video {
            max-width: 100%;
            border-radius: 8px;
            margin: 6px 0;
        }
        /* 底部输入区域 */
        .input-footer {
            padding: 16px 40px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            flex-shrink: 0;
        }
        .input-box {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        #user-input {
            flex: 1;
            min-height: 88px;
            max-height: 200px;
            padding: 12px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 12px;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border 0.2s;
        }
        #user-input:focus {
            border-color: #4080ff;
        }
        .send-btn {
            width: 88px;
            height: 44px;
            border-radius: 10px;
            background: #4080ff;
            color: #fff;
            border: none;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .send-btn:hover {
            opacity: 0.85;
        }
        /* 图片放大弹窗 */
        .img-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }
        .modal-img {
            max-width: 90%;
            max-height: 90vh;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d0d3d9;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <div class="chat-header">
            <div class="logo-icon">AI</div>
            <div class="system-name">智能AI聊天助手</div>
            <div style="position: fixed;right: 20px">
                <button class="send-btn" type="button" @click="clearHistory">清空对话</button>
                <button class="send-btn" type="button" @click="exit">退出登录</button>
            </div>

        </div>

        <!-- 主体：侧边历史 + 聊天区 -->
        <div class="chat-main">
            <!-- 左侧聊天历史 -->
            <div class="history-sidebar">
                <div class="sidebar-title">对话历史</div>
                <div class="history-item" v-for="(item, idx) in historyList" :key="idx">
                    {{ item.title }}
                </div>
            </div>

            <!-- 中间聊天消息区域 -->
            <div class="chat-content">
                <div class="message-wrap" ref="msgScroll">
                    <!-- 循环渲染所有消息 -->
                    <div
                        class="message-item"
                        :class="msg.role === 'user' ? 'message-user' : 'message-ai'"
                        v-for="(msg, index) in chatList"
                        :key="index"
                    >
                        <!-- 头像 -->
                        <div class="avatar" :class="msg.role === 'user' ? 'avatar-user' : 'avatar-ai'">
                            {{ msg.role === 'user' ? '我' : 'AI' }}
                        </div>
                        <!-- 消息气泡区域 -->
                        <div class="bubble-box">
                            <div class="msg-time">{{ msg.time }}</div>
                            <!-- Markdown渲染内容 -->
                            <div
                                class="bubble markdown-body"
                                :class="msg.role === 'user' ? 'bubble-user' : 'bubble-ai'"
                                v-html="renderMarkdown(msg.content)"
                            ></div>
                        </div>
                    </div>
                </div>

                <!-- 底部输入框 -->
                <div class="input-footer">
                    <div class="input-box">
                        <textarea
                            id="user-input"
                            v-model="inputMsg"
                            placeholder="请输入消息，Enter发送，Shift+Enter换行"
                            @keydown="handleKeyDown"
                        ></textarea>
                        <button class="send-btn" @click="sendMessage">发送</button>
                        <button class="send-btn" @click="sendVosk">语音输入</button>

                    </div>
                </div>
            </div>
        </div>

        <!-- 图片放大弹窗 -->
        <div v-if="showImgModal" class="img-modal" @click="closeImgModal">
            <span class="modal-close">×</span>
            <img class="modal-img" :src="modalImgSrc" alt="大图">
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                     w:null,//websocket对象
                    userId: "",//用户id
                    sessionId: "",//会话id
                    // 输入框内容
                    inputMsg: "",
                    // 聊天消息列表
                    chatList: [],
                    // 左侧对话历史列表
                    historyList: [],
                    // 图片弹窗控制
                    showImgModal: false,
                    modalImgSrc: "",
                    // SSE实例缓存
                    sseInstance: null,

                        }
            },
            mounted() {

                 //获取用户登录的信息
                 const userId = localStorage.getItem("userId");
                 const sessionId = localStorage.getItem("sessionId");
                 //把 userId值传
                 this.userId = userId;
                 this.sessionId = sessionId;
                 if (!userId){
                   //跳转到登录页面
                    window.location.href="/static/login.html";
                 }
                // 加载历史对话记录
                this.loadHistory();
                // 页面加载自动滚动到底部
                this.scrollToBottom();
            },
            methods: {
                // 加载历史对话记录
                loadHistory() {
                    if (!this.userId) return;
                    fetch(`/history?session_id=${this.sessionId}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.code !== 200) return;
                            const history = data.history || [];
                            this.chatList = history.map(m => ({
                                role: m.role,
                                content: m.content,
                                time: m.time || ""
                            }));
                            if (data.summary) {
                                this.historyList = [{ title: data.summary }];
                            } else if (history.length > 0) {
                                this.historyList = [{ title: "最近对话" }];
                            }
                        })
                        .catch(err => console.log("加载历史失败:", err));
                },
                // 清空历史对话
                clearHistory() {
                    if (!this.userId) return;
                    if (!confirm("确定要清空当前对话历史吗？")) return;
                    fetch(`/clear_history?user_id=${this.userId}&session_id=${this.sessionId}`, { method: "POST" })
                        .then(res => res.json())
                        .then(data => {
                            if (data.code === 200) {
                                this.chatList = [];
                                this.historyList = [];
                            } else {
                                alert(data.msg || "清空失败");
                            }
                        })
                        .catch(err => {
                            console.log("清空历史失败:", err);
                            alert("清空失败");
                        });
                },
                sendVosk(){
                            //创建一个websocket 协议
                 this.w = new WebSocket("ws://localhost:8000/vosk");
                  //监听开启链接事件
                  this.w.onopen = function (event) {
                      console.log("链接成功");
                  }
                    //监听信息接收事件
                  const self = this;
                  this.w.onmessage =function (event){
                      //判断是否显示语音提示给用户
                      if (event.data.indexOf("请说话...") >-1){
                          alert("请说话")
                      }else{
                          self.inputMsg =event.data;
                          //发送信息
                          self.sendMessage();
                      }

                  }
                },

                exit(){//退出登录函数
                    localStorage.removeItem("userId");
                    window.location.href="/static/login.html";
                },
                // 获取当前格式化时间
                getNowTime() {
                    const date = new Date();
                    const h = String(date.getHours()).padStart(2, '0');
                    const m = String(date.getMinutes()).padStart(2, '0');
                    const s = String(date.getSeconds()).padStart(2, '0');
                    return `${h}:${m}:${s}`;
                },
                // Markdown解析 + 替换图片标签，增加点击放大class
                renderMarkdown(mdText) {
                    if (!mdText) return "";
                    // marked基础转换
                    let html = marked.parse(mdText);
                    // 匹配所有图片，添加chat-img类用于点击放大
                    html = html.replace(/<img/g, '<img class="chat-img"');
                    return html;
                },
                // 滚动聊天区到底部
                scrollToBottom() {
                    this.$nextTick(() => {
                        const scrollDom = this.$refs.msgScroll;
                        if (scrollDom) scrollDom.scrollTop = scrollDom.scrollHeight;
                    })
                },
                // 键盘监听：Enter发送，Shift+Enter换行
                handleKeyDown(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                },

                // 发送消息（保留原有SSE流式逻辑）
                sendMessage() {
                    const msg = this.inputMsg.trim();
                    if (!msg) return;
                    // 1.添加用户消息
                    const userMsg = {
                        role: "user",
                        content: msg,
                        time: this.getNowTime()
                    }
                    this.chatList.push(userMsg);
                    // 侧栏：首次对话时补一个"最近对话"条目
                    if (this.historyList.length === 0) {
                        this.historyList.push({ title: "最近对话" });
                    }
                    // 2.创建空AI消息，用于流式追加
                    const aiMsg = {
                        role: "ai",
                        content: "正在思考，请稍等....",
                        time: this.getNowTime()
                    }
                    this.chatList.push(aiMsg);
                    // 清空输入框
                    this.inputMsg = "";
                    // 滚动到底部
                    this.scrollToBottom();

                    // SSE流式请求（和你原有逻辑保持一致）
                const params = `question=${encodeURIComponent(msg)}&user_id=${encodeURIComponent(this.userId)}&session_id=${encodeURIComponent(this.sessionId)}`;
                    // 关闭上一次未完成的SSE连接
                    if (this.sseInstance) this.sseInstance.close();
                    this.sseInstance = new EventSource('/chat?' + params);

                    this.sseInstance.onmessage = (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            console.log("SSE返回数据：", data);
                            if (data.done) {
                                this.sseInstance.close();
                                this.sseInstance = null;
                                //处理异常情况的流式显示
                                if (data.error){
                                     aiMsg.content += data.data;
                                }

                            } else {
                                //判断是否有提示信息在ai内容，如果有，就删除
                                if(aiMsg.content.indexOf("正在思考，请稍等....")>-1){
                                   aiMsg.content="";
                                }
                                // 流式追加AI内容
                                aiMsg.content += data.data;
                                this.scrollToBottom();
                            }
                        } catch (err) {
                            console.error("SSE解析失败", err);
                        }
                    }
                    // SSE异常关闭
                    this.sseInstance.onerror = () => {
                        this.sseInstance.close();
                        this.sseInstance = null;
                    }
                }
            }
        })
    </script>
</body>
</html>
