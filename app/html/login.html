<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI多智能体平台 · 登录</title>
    <!-- 保持原有Vue & jQuery 引用 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="/static/js/jquery-3.1.1.min.js"></script>

    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --bg-deep: #05070d;
            --accent: #3b82f6;
            --accent-2: #00d4ff;
            --accent-3: #7c5cff;
            --text-main: #eaf0ff;
            --text-dim: #93a4c3;
            --card-bg: rgba(16, 24, 42, 0.62);
            --card-border: rgba(255, 255, 255, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;

            /* 深色底 + 本地背景图片 */
            background-color: var(--bg-deep);
            background-image:
                linear-gradient(160deg, rgba(5, 7, 13, 0.72) 0%, rgba(8, 14, 28, 0.55) 45%, rgba(10, 8, 26, 0.78) 100%),
                url('/static/images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* 漂浮光斑，增强科技氛围 */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.35), transparent 70%);
            top: -140px;
            left: -120px;
        }
        body::after {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(124, 92, 255, 0.35), transparent 70%);
            bottom: -160px;
            right: -140px;
        }

        /* 轻微网格纹理叠加 */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9), transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9), transparent 75%);
        }

        #app {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 44px 40px 38px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 0 1px var(--card-border),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: none;
            transition: transform 0.2s ease;
            animation: float-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes float-in {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 品牌标识 */
        .brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .brand-icon {
            font-size: 40px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            width: 76px;
            height: 76px;
            line-height: 76px;
            border-radius: 22px;
            display: inline-block;
            margin-bottom: 16px;
            box-shadow:
                0 12px 30px rgba(59, 130, 246, 0.45),
                0 0 0 1px rgba(255, 255, 255, 0.12) inset;
            animation: glow-pulse 3.5s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 12px 30px rgba(59, 130, 246, 0.45), 0 0 0 1px rgba(255,255,255,0.12) inset; }
            50%      { box-shadow: 0 12px 42px rgba(0, 212, 255, 0.62), 0 0 0 1px rgba(255,255,255,0.18) inset; }
        }

        .brand h1 {
            font-weight: 600;
            font-size: 26px;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin: 0 0 6px;
        }

        .brand h1 span {
            background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 400;
            margin: 0;
            letter-spacing: 0.4px;
        }

        /* 输入框组 */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7f94;
            font-size: 17px;
            transition: color 0.2s;
            pointer-events: none;
            z-index: 3;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.25s ease;
            outline: none;
            color: var(--text-main);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .input-group input:hover {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.07);
        }

        .input-group input:focus {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
        }

        .input-group input:focus ~ i {
            color: var(--accent-2);
        }

        .input-group input::placeholder {
            color: #5f7390;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* 双按钮行 */
        .action-row {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 110px;
            padding: 14px 10px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .btn i {
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.38);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(0, 212, 255, 0.45);
            filter: brightness(1.05);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.11);
            border-color: rgba(255, 255, 255, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
        }

        .btn-outline:active {
            transform: translateY(0) scale(0.98);
        }

        /* 辅助文案 */
        .footer-note {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: var(--text-dim);
            opacity: 0.75;
            letter-spacing: 0.2px;
        }

        .footer-note i {
            margin-right: 5px;
            color: var(--accent-2);
        }

        /* 验证码输入框右侧提示 */
        .input-group .code-hint {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f93b5;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            pointer-events: none;
        }

        /* 去除input默认清除图标 */
        input[type="text"]::-ms-clear {
            display: none;
        }

        /* 按钮禁用状态 */
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            #app {
                padding: 32px 24px 28px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 22px;
            }

            .input-group input {
                padding: 14px 16px 14px 46px;
                font-size: 15px;
            }

            .btn {
                font-size: 14px;
                padding: 12px 8px;
                min-width: 90px;
            }
        }
    </style>
</head>
<body>

<!-- 网格纹理层 -->
<div class="grid-overlay"></div>

<div id="app">
    <!-- 品牌区 -->
    <div class="brand">
        <div class="brand-icon">
            <i class="fas fa-robot"></i>
        </div>
        <h1>智汇面<span>AI多智能体</span></h1>
        <p>安全 · 协作 · 下一代平台</p>
    </div>

    <!-- 邮箱输入 -->
    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="text" placeholder="请输入邮箱" v-model="email" autocomplete="email">
    </div>

    <!-- 验证码输入 -->
    <div class="input-group">
        <i class="fas fa-shield-alt"></i>
        <input type="text" placeholder="请输入验证码" v-model="code" autocomplete="off">
        <span class="code-hint"><i class="fas fa-lock"></i> 6位</span>
    </div>

    <!-- 按钮组 (完全保留原有逻辑) -->
    <div class="action-row">
        <button type="button" class="btn btn-outline" @click="sendCode">
            <i class="fas fa-paper-plane"></i> 发送验证码
        </button>
        <button type="button" class="btn btn-primary" @click="login">
            <i class="fas fa-sign-in-alt"></i> 登录
        </button>
    </div>

    <!-- 底部 (纯装饰) -->
    <div class="footer-note">
        <i class="fas fa-robot"></i> 多智能体系统 · 安全验证
    </div>
</div>

<script>
    // 您的原始JS代码 — 完全保留，未作任何修改
    new Vue({
        el:"#app",
        data:{
            email:"",
            code:""
        },
        mounted() {//生命周期函数
            //迁移清理：清掉旧版本 localStorage 遗留的登录态，避免缓存导致跳转死循环
            localStorage.removeItem("userId");
            localStorage.removeItem("sessionId");
            const userId = sessionStorage.getItem("userId");
            const sessionId = sessionStorage.getItem("sessionId");
            if (userId && sessionId){
                window.location.href="/static/chat.html";
            }
        },
        methods: {
            sendCode() {
                $.ajax({
                    url:"/sendCode",
                    data:{"email":this.email},
                    success:function (rs){
                        console.log(rs);
                        if (rs.code === 200){
                            alert(rs.msg);
                        }else{
                            alert(rs.msg);
                        }
                    }
                })
            },
            login(){
                $.ajax({
                    url:"/login",
                    data:{"email":this.email,"code":this.code},
                    success:function (rs){
                        console.log(rs);
                        if (rs.code === 200){
                            alert(rs.msg);
                            sessionStorage.setItem("userId",rs.user_id);
                            sessionStorage.setItem("sessionId",rs.session_id);
                            window.location.href="/static/chat.html";
                        }else{
                            alert(rs.msg);
                        }
                    }
                })
            }
        }
    })
</script>

</body>
</html>
